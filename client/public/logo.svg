  <!-- Left Leaf -->
  <path d="M24 28 C 14 26, 10 18, 14 14 C 18 12, 23 20, 24 28 Z" fill="url(#leafGrad)"/>
  <!-- Right Leaf -->
  <path d="M24 22 C 34 20, 38 12, 34 8 C 30 6, 25 14, 24 22 Z" fill="url(#leafGrad)"/>
  
  <!-- Soil base furrow -->
  <path d="M12 38 Q 24 42 36 38" stroke="#8f6855" stroke-width="3" stroke-linecap="round"/>
